name: motoradar
description: "A sporty and aggressive motorcycle ride-sharing app."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  intl: ^0.19.0
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  firebase_database: ^10.2.0
  firebase_storage: ^11.5.0
  provider: ^6.1.0
  geolocator: ^9.0.2
  google_maps_flutter: ^2.5.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_linter: ^3.0.0

flutter:
  uses-material-design: true
